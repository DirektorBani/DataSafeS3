        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /shares/{id}:
    delete:
      operationId: revokeShare
      summary: Revoke share link
      tags: [Shares]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - name: id
            in: path
            required: true
            schema: { type: string }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/share/{token}:
    get:
      operationId: publicShareInfo
      summary: Public share metadata
      tags: [Shares]
      x-community: true
      security: []
      parameters:
          - name: token
            in: path
            required: true
            schema: { type: string }
      responses:
        '200': { description: Share info (no auth) }

  /public/share/{token}/download:
    get:
      operationId: publicShareDownload
      summary: Download via share token
      tags: [Shares]
      x-community: true
      security: []
      parameters:
          - name: token
            in: path
            required: true
            schema: { type: string }
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /buckets/{bucket}/object-retention:
    put:
      operationId: putObjectRetention
      summary: Set object retention
      tags: [Lifecycle]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    get:
      operationId: getObjectRetention
      summary: Get object retention
      tags: [Lifecycle]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Retention }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /healthz:
    servers:
      - url: http://localhost:9000
        description: storage-server origin. /healthz is not under /api/v1.
    get:
      operationId: getHealthz
      summary: Process health, advertised version, and KMS summary
      tags: [Health]
      x-community: true
      x-clients: [desktop]
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string }
                  version: { type: string }
                  commit: { type: string }
                  kms:
                    type: object
                    properties:
                      available: { type: boolean }
                      provider: { type: string }
                  read_only_mode: { type: boolean }
                  object_backend: { type: string }

  /capabilities:
    get:
      operationId: getCapabilities
      summary: API version, login methods, and authenticated feature flags
      tags: [Health]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.1"
      security: []
      responses:
        '200':
          description: Public fields always. features, clients, and deprecations only when the bearer token is valid.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login-options:
    get:
      operationId: getLoginOptions
      summary: Login flags that are safe to show before authentication
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  local_login_enabled: { type: boolean }

  /admin/login:
    post:
      operationId: adminLogin
      summary: Password login
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session, or an MFA challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /mfa/login:
    post:
      operationId: mfaLogin
      summary: Complete TOTP or recovery-code login
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFALoginRequest' }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login/mfa:
    post:
      operationId: mfaLoginAlias
      summary: Alias of POST /mfa/login
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFALoginRequest' }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/mfa/webauthn/begin:
    post:
      operationId: webauthnLoginBegin
      summary: Begin a WebAuthn login assertion
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              properties:
                mfa_token: { type: string }
      responses:
        '200': { description: WebAuthn request options }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/mfa/webauthn/finish:
    post:
      operationId: webauthnLoginFinish
      summary: Finish a WebAuthn login assertion
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      parameters:
        - name: mfa_token
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/oidc/config:
    get:
      operationId: getOIDCConfig
      summary: Public OIDC flags. Includes the issuer when OIDC is enabled.
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      responses:
        '200':
          description: OIDC availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  issuer: { type: string }
                  issuer_reachable: { type: boolean }
                  issuer_error: { type: string }

  /auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start the OIDC authorization-code redirect
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      responses:
        '302':
          description: Redirect to the identity provider
          headers:
            Location: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC redirect target. The browser, not the Desktop agent, calls this.
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect with a one-time exchange code
          headers:
            Location: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/oidc/exchange:
    post:
      operationId: oidcExchange
      summary: Redeem a one-time OIDC exchange code
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exchange_code]
              properties:
                exchange_code: { type: string }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
                  auth_source: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/oidc/password-login:
    post:
      operationId: oidcPasswordLogin
      summary: OIDC resource-owner password grant. Disabled only when STORAGE_OIDC_ROPC_ENABLED is false
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  auth_source: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/logout:
    post:
      operationId: logout
      summary: End the local session. A password JWT stays valid until it expires.
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      responses:
        '204':
          description: Logged out. A password JWT stays valid until it expires, so the body is empty.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/step-up:
    post:
      operationId: stepUp
      summary: Issue a one-time step-up token
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string }
                target: { type: string }
                code: { type: string }
                totp_code: { type: string }
      responses:
        '200': { description: Step-up token }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/step-up/webauthn/begin:
    post:
      operationId: stepUpWebauthnBegin
      summary: Begin a WebAuthn step-up
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.0"
      responses:
        '200': { description: WebAuthn request options }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/step-up/webauthn/finish:
    post:
      operationId: stepUpWebauthnFinish
      summary: Finish a WebAuthn step-up
      tags: [Auth]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.0"
      responses:
        '200': { description: Step-up token }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /buckets/{bucket}/encryption:
    get:
      operationId: getBucketEncryption
      summary: Read bucket encryption. Desktop does not change it.
      tags: [Buckets]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.0"
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Encryption view }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /buckets/{bucket}/sharing:
    get:
      operationId: getBucketSharing
      summary: Read the bucket sharing policy. Desktop does not edit it.
      tags: [Shares]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.0"
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Policy, effective policy, and locked fields }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /buckets/{bucket}/shares/revoke-all:
    post:
      operationId: revokeAllShares
      summary: Revoke every share link on the bucket
      tags: [Shares]
      x-community: true
      x-clients: [desktop]
      x-since: "1.6.0"
      parameters:
        - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: First-run setup flags
      tags: [Setup]
      x-community: true
      x-clients: [desktop]
      security: []
      responses:
        '200':
          description: Setup flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  initial_setup_completed: { type: boolean }
                  admin_first_login_completed: { type: boolean }
                  admin_password_changed: { type: boolean }
                  needs_password_change: { type: boolean }
                  needs_setup: { type: boolean }

  /setup/complete:
    post:
      operationId: completeSetup
      summary: Mark first-run setup complete
      tags: [Setup]
      x-community: true
      x-clients: [desktop]
      responses:
        '200': { description: Completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

tags:
  - name: Health
    description: Health probe
  - name: Profile
    description: Current user profile
  - name: Buckets
    description: Bucket and object operations
  - name: Keys
    description: S3 access keys and presign
  - name: Shares
    description: Share links and public download
  - name: Tokens
    description: Integration API tokens (ds_*)
  - name: Usage
    description: Storage usage (scoped to caller)
  - name: Search
    description: Search, favorites, tags, trash
  - name: Lifecycle
    description: Bucket lifecycle and object lock
