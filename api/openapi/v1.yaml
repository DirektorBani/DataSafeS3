openapi: 3.1.0
info:
  title: DataSafeS3 Community Integration API
  version: 1.6.1
  x-error-codes:
    auth.unauthorized: missing or invalid bearer token
    auth.invalid_credentials: password login rejected
    auth.session_expired: OIDC session is no longer active
    auth.step_up_required: dangerous action needs a step-up token
    auth.mfa_setup_required: administrator must enroll MFA
    auth.mfa_required: MFA is required for this action
    auth.mfa_token_invalid: MFA or step-up token was rejected
    access.forbidden: caller lacks permission
    access.quota_exceeded: quota blocked the write
    sharing.policy_denied: share or presign policy refused the request
    resource.not_found: bucket, object, or other resource is missing
    resource.conflict: resource already exists or is not empty
    resource.gone: share link expired
    multipart.upload_not_found: uploadId is unknown for this bucket
    request.invalid: body or parameter failed validation
    rate_limited: too many requests; see Retry-After
    setup.required: first-run setup is not finished
    setup.password_change_required: setup cannot finish until the admin password changes
    internal: server failure
  summary: /api/v1 contract for the console integration API and DataSafeS3 Desktop
  description: |
    **DataSafeS3 Community edition** — JSON REST Integration API for machine clients and integrators.

    ## Authentication
    Use an **API token** (prefix ds_*) in header Authorization Bearer ds_...
    Create tokens in the web console: **Access → API tokens → Create** (human login once).

    ## Out of scope
    - Admin routes (users, system settings, webhooks, tenants, gateway) — see openapi-full.yaml
    - AWS **S3 XML API** (SigV4) on port **9000** — use AWS SDKs

    ## Errors
    JSON object. `error` is the legacy text from 1.6.0 and does not change in /api/v1.
    1.6.1 also returns `code`, `message`, `details`, and `request_id`.
    Delete may return scheduled_delete_at, trashed, trash_id.

    ## Capabilities
    `GET /capabilities` without a token returns `api`, `server_version`, `spec_version`,
    and `login_methods` only. `features`, `clients`, and `deprecations` require a bearer token.
    The response does not include IdP addresses, usernames, or secrets.

    Contract rules: docs/api/compatibility.md.

    Docs: [Swagger UI guide](../../docs/en/api/swagger.md) · [Full API spec](../../api/openapi-full.yaml)
  contact:
    name: DataSafeS3 / Ilya Trachuk
    url: https://github.com/DirektorBani/DataSafeS3
  license:
    name: Apache 2.0
    identifier: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Console origin via Caddy (Swagger UI at /api/v1/docs)
  - url: http://localhost:9000/api/v1
    description: storage-server direct

security:
  - BearerAPIToken: []
  - BearerJWT: []

components:
  securitySchemes:
    BearerAPIToken:
      type: http
      scheme: bearer
      bearerFormat: ds_
      description: |
        Integration API token with prefix ds_. Create in console: Access → API tokens.
        Inherits creator's role and bucket access.
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Console JWT from POST /admin/login or POST /mfa/login. TTL is 24 hours.
        OIDC JWTs are shorter and are checked against the server session.

  parameters:
    BucketName:
      name: bucket
      in: path
      required: true
      schema: { type: string }
    ObjectKey:
      name: key
      in: path
      required: true
      schema: { type: string }
      description: Object key (may contain slashes)
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    Prefix:
      name: prefix
      in: query
      schema: { type: string }
    Delimiter:
      name: delimiter
      in: query
      schema: { type: string, example: "/" }
    StartAfter:
      name: start_after
      in: query
      schema: { type: string }
    MaxKeys:
      name: max_keys
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }

  schemas:
    ErrorResponse:
      type: object
      required: [error, code, message, request_id]
      description: |
        `error` is the legacy string. `code` is the stable machine code.
        `message` is English text for logs. `details` holds extra fields; the same
        fields also stay at the top level (`action`, `target`, `mfa_setup_required`).
      properties:
        error: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        request_id: { type: string }
        mfa_required: { type: boolean }
        mfa_token: { type: string }
        mfa_setup_required: { type: boolean }
        action: { type: string }
        target: { type: string }
        scheduled_delete_at: { type: string, format: date-time }
        trashed: { type: boolean }
        trash_id: { type: string }
    ErrorCode:
      type: string
      description: Stable machine code. New codes are additive. Renaming a code for an existing case is breaking.
      enum:
        - auth.unauthorized
        - auth.invalid_credentials
        - auth.session_expired
        - auth.step_up_required
        - auth.mfa_setup_required
        - auth.mfa_required
        - auth.mfa_token_invalid
        - access.forbidden
        - access.quota_exceeded
        - sharing.policy_denied
        - resource.not_found
        - resource.conflict
        - resource.gone
        - multipart.upload_not_found
        - request.invalid
        - rate_limited
        - setup.required
        - setup.password_change_required
        - internal
    Capabilities:
      type: object
      required: [api, server_version, spec_version, login_methods]
      properties:
        api: { type: string, enum: [v1] }
        server_version: { type: string, example: "1.6.1" }
        spec_version: { type: string, example: "1.6.1" }
        login_methods:
          type: array
          items: { type: string, enum: [password, oidc] }
        features:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: Authenticated callers only. Absent keys are off. A feature disabled by configuration is omitted.
        clients:
          type: object
          description: Authenticated callers only.
          properties:
            desktop: { $ref: '#/components/schemas/DesktopClientCompat' }
        deprecations:
          type: array
          description: Authenticated callers only.
          items: { $ref: '#/components/schemas/DeprecationNotice' }
    DesktopClientCompat:
      type: object
      required: [min_supported]
      properties:
        min_supported: { type: string, example: "1.0.0" }
        min_required: { type: string, nullable: true }
        min_required_reason: { type: string, nullable: true, description: security, or null when min_required is unset }
        advisory_url: { type: string, nullable: true }
        max_tested: { type: string, nullable: true }
    DeprecationNotice:
      type: object
      required: [method, path, since]
      properties:
        method: { type: string }
        path: { type: string }
        field: { type: string }
        since: { type: string }
        sunset: { type: string, nullable: true }
        replacement: { type: string, nullable: true }
        notes_url: { type: string, nullable: true }

    HealthStatus:
      type: object
      properties:
        status: { type: string, example: ok }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        mfa_code: { type: string }

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        expires_in: { type: integer, example: 86400 }
        username: { type: string }
        role: { type: string, enum: [administrator, operator, user] }
        user_id: { type: string }
        mfa_enabled: { type: boolean }
        mfa_required: { type: boolean }
        mfa_token: { type: string }

    MFALoginRequest:
      type: object
      required: [mfa_token, mfa_code]
      properties:
        mfa_token: { type: string }
        mfa_code: { type: string }

    MeResponse:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        user_id: { type: string }
        tenant_id: { type: string }
        mfa_enabled: { type: boolean }
        auth_source: { type: string }
        is_tenant_admin: { type: boolean }
        tenant_memberships:
          type: array
          items:
            type: object
            properties:
              tenant_id: { type: string }
              tenant_name: { type: string }
              role: { type: string }

    Bucket:
      type: object
      properties:
        name: { type: string }
        storage_key: { type: string }
        owner: { type: string }
        owner_id: { type: string }
        tenant_id: { type: string }
        created_at: { type: string, format: date-time }
        visibility: { type: string, enum: [private, public-read] }
        access:
          type: object
          properties:
            ownership: { type: string, enum: [owned, shared, tenant] }
            can_read: { type: boolean }
            can_write: { type: boolean }
            shared_by: { type: string, nullable: true }
        versioning_enabled: { type: boolean }
        object_lock_enabled: { type: boolean }
        description: { type: string }
        tags: { type: object, additionalProperties: { type: string } }

    Object:
      type: object
      properties:
        bucket: { type: string }
        key: { type: string }
        size: { type: integer, format: int64 }
        etag: { type: string }
        content_type: { type: string }
        version_id: { type: string }
        last_modified: { type: string, format: date-time }
        legal_hold: { type: boolean }
        retention_until: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: { type: string } }
        tags: { type: object, additionalProperties: { type: string } }

    ObjectListResponse:
      type: object
      properties:
        objects:
          type: array
          items: { $ref: '#/components/schemas/Object' }
        folders:
          type: array
          items: { type: string }
        truncated: { type: boolean }
        next_marker: { type: string }

    AccessKey:
      type: object
      properties:
        access_key: { type: string }
        label: { type: string }
        owner: { type: string }
        created_at: { type: string, format: date-time }

    ShareLink:
      type: object
      properties:
        id: { type: string }
        bucket: { type: string }
        key: { type: string }
        token: { type: string }
        max_downloads: { type: integer }
        download_count: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    APIToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        scopes:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [administrator, operator, user] }
        status: { type: string }
        tenant_id: { type: string }
        team_id: { type: string, description: Primary legacy team assignment }
        mfa_enabled: { type: boolean }

    Team:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }

    TeamMember:
      type: object
      properties:
        user_id: { type: string }
        username: { type: string }
        email: { type: string }

    PutTeamMembersRequest:
      type: object
      properties:
        user_ids:
          type: array
          items: { type: string }

    CreateShareRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, description: Object key to share }
        expires_in_sec: { type: integer, minimum: 0, description: "TTL; 0 = no expiry" }
        max_downloads: { type: integer, minimum: 0, default: 0 }

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_days: { type: integer, minimum: 1, default: 90 }
        scopes: { type: array, items: { type: string } }

    CreateTokenResponse:
      type: object
      properties:
        id: { type: string }
        token: { type: string, description: Plain token shown once }
        name: { type: string }
        expires_at: { type: string, format: date-time }

    PresignRequest:
      type: object
      required: [bucket, key]
      properties:
        method: { type: string, enum: [GET, PUT, HEAD, DELETE], default: GET }
        bucket: { type: string }
        key: { type: string }
        expires_seconds: { type: integer, minimum: 1, default: 3600 }
        endpoint: { type: string, format: uri, description: S3 base URL, default request Host }

    PresignResponse:
      type: object
      properties:
        url: { type: string, format: uri }

    CreateKeyRequest:
      type: object
      properties:
        label: { type: string }

    CreateKeyResponse:
      type: object
      properties:
        access_key: { type: string }
        secret_key: { type: string, description: Shown once }
        label: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 6 }

    HooksTestRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        event: { type: string, example: extension.test }
        secret: { type: string }

    BulkDeleteRequest:
      type: object
      required: [keys]
      properties:
        keys: { type: array, items: { type: string }, minItems: 1 }

    TagsMap:
      type: object
      additionalProperties: { type: string }

    LifecycleRules:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              prefix: { type: string }
              enabled: { type: boolean }
              expiration_days: { type: integer }

  examples:
    HealthOk:
      value: { status: ok }
    ErrorUnauthorized:
      value:
        error: unauthorized
        code: auth.unauthorized
        message: Unauthorized
        details: {}
        request_id: req_example
    CreateShareBody:
      value: { key: reports/2024/q1.pdf, expires_in_sec: 86400, max_downloads: 10 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limited. Retry-After is the delay in seconds.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      x-community: true
      x-clients: [desktop]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /me:
    get:
      operationId: getMe
      summary: Current user profile
      tags: [Profile]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/password:
    post:
      operationId: changePassword
      summary: Change password
      tags: [Profile]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/mfa/webauthn/register/begin:
    post:
      operationId: webauthnRegisterBegin
      summary: Begin WebAuthn passkey enrollment
      tags: [Profile]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      responses:
        '200': { description: PublicKeyCredentialCreationOptions JSON }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/mfa/webauthn/register/finish:
    post:
      operationId: webauthnRegisterFinish
      summary: Finish WebAuthn passkey enrollment
      tags: [Profile]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      responses:
        '200': { description: Passkey enrolled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /buckets:
    get:
      operationId: listBuckets
      summary: List buckets
      tags: [Buckets]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - name: filter
            in: query
            schema: { type: string, enum: [owned, shared, tenant, all] }
            description: Filter by access.ownership (default all)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items: { $ref: '#/components/schemas/Bucket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /buckets/{bucket}:
    post:
      operationId: createBucket
      summary: Create bucket
      tags: [Buckets]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
      responses:
        '201':
          description: Created with visibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket: { type: string }
                  visibility: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    delete:
      operationId: deleteBucket
      summary: Delete empty bucket
      tags: [Buckets]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /buckets/{bucket}/access:
    get:
      operationId: listBucketAccessByBucket
      summary: List bucket access grants (owner or tenant admin)
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Grants }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      operationId: putBucketAccessByBucket
      summary: Replace bucket access grants
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /buckets/{bucket}/access/{user_id}:
    delete:
      operationId: deleteBucketAccessByBucket
      summary: Revoke bucket access for user
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
          - name: user_id
            in: path
            required: true
            schema: { type: string }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shareable-users:
    get:
      operationId: listShareableUsers
      summary: Users that can receive bucket grants
      tags: [Shares]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - name: bucket
            in: query
            required: true
            schema: { type: string }
          - name: q
            in: query
            schema: { type: string }
            description: Username search (max 50 results)
      responses:
        '200': { description: Users }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications:
    get:
      operationId: listNotifications
      summary: In-app notifications for current user
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      responses:
        '200': { description: Notifications }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark notification as read
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - name: id
            in: path
            required: true
            schema: { type: string }
      responses:
        '204': { description: Read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all notifications read
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      responses:
        '204': { description: Read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /recent:
    get:
      operationId: listRecent
      summary: Recently accessed buckets and folders
      tags: [Buckets]
      x-community: true
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      responses:
        '200': { description: Recent items }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /buckets/{bucket}/objects:
    get:
      operationId: listObjects
      summary: List objects
      tags: [Buckets]
      x-community: true
      x-clients: [desktop]
      security:
        - BearerAPIToken: []
        - BearerJWT: []
      parameters:
          - $ref: '#/components/parameters/BucketName'
          - $ref: '#/components/parameters/Prefix'
          - $ref: '#/components/parameters/Delimiter'
          - $ref: '#/components/parameters/StartAfter'
