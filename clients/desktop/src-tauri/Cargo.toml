[package]
name = "datasafe-desktop"
version = "1.0.0-dev"
description = "DataSafeS3 Desktop"
authors = ["Ilya Trachuk"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "2.5"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "apple-native"] }

[lib]
name = "datasafe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "datasafe-desktop"
path = "src/main.rs"
