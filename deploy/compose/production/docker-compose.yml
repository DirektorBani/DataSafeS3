# Production single node: Bolt metadata, persistent volume, Caddy in front.
# STORAGE_DEV is false and is not taken from the environment.
# /metrics is not published by Caddy. Prometheus, if you add it, scrapes
# storage-server:9000 on the compose network with STORAGE_METRICS_TOKEN.
#
#   cp .env.example .env
#   docker compose --env-file .env -f deploy/compose/production/docker-compose.yml up -d
#
# TLS: put certs in ./certs and add --profile tls.
# Backups: stop writes or snapshot the storage-data volume. It holds objects
# and the Bolt file data/metadata.db. See docs/production-checklist.md.

name: datasafes3

services:
  storage-server:
    image: ${DATASAFE_SERVER_IMAGE:-ghcr.io/direktorbani/datasafe-storage-server:v1.7.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_ADDR: ":9000"
      STORAGE_DATA_DIR: /data
      STORAGE_DEV: "false"
      STORAGE_METADATA_BACKEND: bolt
      STORAGE_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${S3_BIND_PORT:-9000}:9000"
    volumes:
      - storage-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  console-assets:
    image: ${DATASAFE_CONSOLE_IMAGE:-ghcr.io/direktorbani/datasafe-console:v1.7.0}
    restart: "no"
    environment:
      CONSOLE_SRC: /srv/console
    volumes:
      - console-dist:/console-assets
      - ../../docker/copy-console-assets.sh:/copy-console-assets.sh:ro
    command: ["/bin/sh", "/copy-console-assets.sh"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      storage-server:
        condition: service_healthy
      console-assets:
        condition: service_completed_successfully
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - console-dist:/srv/console:ro
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config

  caddy-tls:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      storage-server:
        condition: service_healthy
      console-assets:
        condition: service_completed_successfully
    ports:
      - "${PUBLIC_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - console-dist:/srv/console:ro
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config

volumes:
  storage-data:
  console-dist:
