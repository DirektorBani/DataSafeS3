# Site B stack for site-replication lab (separate data root + ports).
services:
  storage-server:
    environment:
      STORAGE_CLUSTER_ID: ${STORAGE_CLUSTER_ID:-cluster-b}
      STORAGE_CLUSTER_ENDPOINT: ${STORAGE_CLUSTER_ENDPOINT:-http://host.docker.internal:9193}
      STORAGE_TRUSTED_CLUSTER_REPL_ENABLED: ${STORAGE_TRUSTED_CLUSTER_REPL_ENABLED:-true}
    ports: !override
      - "${SITE_B_STORAGE_PORT:-9193}:9000"

  caddy:
    ports: !override
      - "${SITE_B_HTTP_PORT:-9082}:80"

  postgres:
    ports: !override
      - "${SITE_B_PG_PORT:-5542}:5432"

  prometheus:
    ports: !override
      - "${SITE_B_PROMETHEUS_PORT:-9192}:9090"

  grafana:
    ports: !override
      - "${SITE_B_GRAFANA_PORT:-3102}:3000"
