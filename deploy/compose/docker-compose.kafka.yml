# Opt-in Kafka lab. Not included by the default installer profiles.
# One KRaft broker from the official Apache image (pinned tag).
# In-stack clients use kafka:19092. Host tools use localhost:9092.
# storage-server receives STORAGE_KAFKA_BROKERS only when this file is applied.

services:
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Lab convenience. An idempotent producer still wants the topic to exist
      # before the first produce; create datasafe.events if the first event
      # returns UNKNOWN_TOPIC_OR_PARTITION.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  storage-server:
    environment:
      STORAGE_KAFKA_BROKERS: kafka:19092
      STORAGE_KAFKA_TOPIC: datasafe.events
    depends_on:
      kafka:
        condition: service_started
