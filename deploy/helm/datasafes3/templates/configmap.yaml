apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datasafes3.fullname" . }}
  labels:
    {{- include "datasafes3.labels" . | nindent 4 }}
data:
  STORAGE_ADDR: ":9000"
  STORAGE_DATA_DIR: {{ .Values.storageServer.dataDir | quote }}
  STORAGE_REGION: {{ .Values.storageServer.region | quote }}
  STORAGE_LOG_LEVEL: {{ .Values.storageServer.logLevel | quote }}
  STORAGE_DEV: "false"
  STORAGE_METADATA_BACKEND: {{ include "datasafes3.metadataBackend" . | quote }}
  STORAGE_HA_ENABLED: {{ ternary "true" "false" .Values.cluster.enabled | quote }}
  {{- if .Values.events.natsURL }}
  STORAGE_NATS_URL: {{ .Values.events.natsURL | quote }}
  {{- end }}
  {{- if .Values.events.kafkaBrokers }}
  STORAGE_KAFKA_BROKERS: {{ .Values.events.kafkaBrokers | quote }}
  STORAGE_KAFKA_TOPIC: {{ .Values.events.kafkaTopic | quote }}
  {{- end }}
  {{- if eq (include "datasafes3.metadataBackend" .) "postgres" }}
  STORAGE_POSTGRES_HOST: {{ include "datasafes3.postgresHost" . | quote }}
  STORAGE_POSTGRES_PORT: {{ .Values.postgres.external.port | default "5432" | quote }}
  STORAGE_POSTGRES_DB: {{ .Values.postgres.external.database | default .Values.postgres.auth.database | quote }}
  STORAGE_POSTGRES_USER: {{ .Values.postgres.external.user | default .Values.postgres.auth.username | quote }}
  {{- end }}
