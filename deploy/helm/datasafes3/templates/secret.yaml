{{- include "datasafes3.requireAuth" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datasafes3.fullname" . }}-auth
  labels:
    {{- include "datasafes3.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.auth.accessKey | quote }}
  secretKey: {{ .Values.auth.secretKey | quote }}
  adminUser: {{ .Values.auth.adminUser | quote }}
  adminPassword: {{ .Values.auth.adminPassword | quote }}
  jwtSecret: {{ .Values.auth.jwtSecret | quote }}
  metricsToken: {{ .Values.auth.metricsToken | quote }}
{{- end }}
{{- if and (not .Values.postgres.enabled) .Values.postgres.external.host (not .Values.postgres.external.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datasafes3.fullname" . }}-postgres
  labels:
    {{- include "datasafes3.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.external.user | quote }}
  password: {{ required "postgres.external.password or postgres.external.existingSecret" .Values.postgres.external.password | quote }}
  database: {{ .Values.postgres.external.database | quote }}
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datasafes3.fullname" . }}-postgres
  labels:
    {{- include "datasafes3.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.auth.username | quote }}
  password: {{ required "postgres.auth.password or postgres.auth.existingSecret" .Values.postgres.auth.password | quote }}
  database: {{ .Values.postgres.auth.database | quote }}
{{- end }}
