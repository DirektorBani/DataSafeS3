# Offline lab using only images already present on this Docker host.
# No build, no registry pull.
name: datasafe-cluster-lab-local

services:
  etcd0:
    image: registry.k8s.io/etcd:3.6.4-0
    container_name: ds-lab-etcd0
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd0:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=datasafe-lab
      - --initial-cluster-state=new
    networks: [labnet]

  etcd1:
    image: registry.k8s.io/etcd:3.6.4-0
    container_name: ds-lab-etcd1
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=datasafe-lab
      - --initial-cluster-state=new
    networks: [labnet]

  etcd2:
    image: registry.k8s.io/etcd:3.6.4-0
    container_name: ds-lab-etcd2
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=datasafe-lab
      - --initial-cluster-state=new
    networks: [labnet]

  postgres:
    image: postgres:16-alpine
    container_name: ds-lab-postgres
    environment:
      POSTGRES_PASSWORD: datasafesuper
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    networks: [labnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: ${DATASAFE_LAB_STORAGE_IMAGE:-ghcr.io/direktorbani/datasafe-storage-server:v1.1.0}
    container_name: ds-lab-storage
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STORAGE_ADDR: ":9000"
      STORAGE_DATA_DIR: /data/objects
      STORAGE_METADATA_BACKEND: postgres
      STORAGE_POSTGRES_DSN: postgres://postgres:datasafesuper@postgres:5432/postgres?sslmode=disable
      STORAGE_OBJECT_BACKEND: erasure
      STORAGE_ERASURE_LAYOUT: dev
      STORAGE_ERASURE_DATA_PATHS: /data/s0,/data/s1,/data/s2
      STORAGE_ACCESS_KEY: datasafe
      STORAGE_SECRET_KEY: datasafesecret
      STORAGE_ADMIN_USER: admin
      STORAGE_ADMIN_PASSWORD: admin
      STORAGE_JWT_SECRET: datasafe-lab-jwt-secret-change-me
      STORAGE_REGION: us-east-1
      STORAGE_DEV: "true"
    volumes:
      - lab_s0:/data/s0
      - lab_s1:/data/s1
      - lab_s2:/data/s2
      - lab_obj:/data/objects
    ports:
      - "9010:9000"
    networks: [labnet]

  caddy:
    image: caddy:2-alpine
    container_name: ds-lab-caddy
    depends_on: [storage]
    ports:
      - "8081:8080"
    volumes:
      - ./Caddyfile.lab:/etc/caddy/Caddyfile:ro
    networks: [labnet]

networks:
  labnet:
    driver: bridge

volumes:
  lab_s0:
  lab_s1:
  lab_s2:
  lab_obj:
