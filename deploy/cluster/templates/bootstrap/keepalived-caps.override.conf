# Example systemd drop-in for keepalived as datasafes3 (U8).
# Apply copies to /etc/systemd/system/keepalived.service.d/override.conf
[Service]
User=datasafes3
Group=datasafes3
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
# If caps fail at runtime, Apply falls back to User=root with a warning.
