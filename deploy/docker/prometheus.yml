global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "storage-server"
    static_configs:
      - targets: ["storage-server:9000"]
    # metrics_auth

  # Optional multi-node scrape (cluster). Copy targets example and mount:
  #   ./deploy/docker/prometheus/targets:/etc/prometheus/targets:ro
  # Edit cluster-nodes.json with each node's host:9000 (VIP or per-node).
  - job_name: "datasafe-cluster-nodes"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cluster-nodes.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    # metrics_auth
