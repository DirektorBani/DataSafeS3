global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "storage-server"
    static_configs:
      - targets: ["storage-server:9000"]
    # metrics_auth

  # Optional multi-node scrape (cluster). Copy targets example and mount:
  #   ./deploy/docker/prometheus/targets:/etc/prometheus/targets:ro
  # The shipped cluster-nodes.json has an empty target list, so single-node
  # is scraped only by the storage-server job above. Add each extra node's
  # host:9000 here (VIP or per-node). Do not repeat storage-server:9000.
  - job_name: "datasafe-cluster-nodes"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cluster-nodes.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    # metrics_auth
