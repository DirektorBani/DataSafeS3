# Release build and publish, entirely on GitVerse (no GitHub, GHCR or Docker Hub).
#
# Trigger: push of a tag v* (or manual run with a tag name).
# Output (all on gitverse.ru):
#   images    gitverse.ru/direktorbani/datasafe-storage-server:<tag>|latest  (linux/amd64 + linux/arm64)
#             gitverse.ru/direktorbani/datasafe-console:<tag>|latest
#   packages  apt (.deb) + dnf (.rpm) + Helm chart datasafes3 in the package registries
#   release   GitVerse release page with SHA256SUMS.txt, image digests, SBOM archive, licence notices
#
# No Docker daemon is needed: scripts/build-images.sh cross-compiles with Go and
# assembles the images with tools/imgbuild (go-containerregistry). Sources of
# build inputs are the GitVerse mirrors go-mirror / npm-mirror / dh-mirror.
#
# Required repository secret (Settings -> CI/CD -> Secrets): REGISTRY_TOKEN
#   a GitVerse personal access token of user DirektorBani with write access to
#   packages and to the repository (releases). Secret names cannot start with GITVERSE_.
#
# Runner limits: a cloud job is capped (15 or 30 min depending on the docs page),
# so work is split into jobs. Jobs do not share artifacts; each one rebuilds what
# it needs, and only `packages` produces the files that are checksummed.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.7.1"
        required: true
      dry_run:
        description: "true = build everything (images to OCI layouts, packages, chart, SBOM) but publish nothing"
        required: false
        default: "false"

env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  GOPROXY: "https://go-mirror.gitverse.ru,direct"
  GOTOOLCHAIN: local
  NPM_REGISTRY: "https://npm-mirror.gitverse.ru/"
  GV_USER: DirektorBani
  REGISTRY: gitverse.ru/direktorbani

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.sha || github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: tag matches VERSION
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test "v$(tr -d '[:space:]' < VERSION)" = "$TAG" || { echo "VERSION does not match tag $TAG"; exit 1; }
      - name: release pins, compose paths, workflow
        run: |
          bash scripts/check-release-pins.sh
          python3 scripts/check-compose-paths.py
          python3 scripts/check_release_workflow.py
      - name: go vet and build
        run: |
          go vet ./...
          go build ./...

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.sha || github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: registry login (docker config, token never printed)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then echo "dry run: no registry login"; exit 0; fi
          test -n "$REGISTRY_TOKEN" || { echo "secret REGISTRY_TOKEN is not set"; exit 1; }
          umask 077
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$GV_USER" "$REGISTRY_TOKEN" | base64 -w0)
          printf '{"auths":{"gitverse.ru":{"auth":"%s"}}}' "$auth" > "$HOME/.docker/config.json"
      - name: build and push both images (amd64 + arm64)
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$DRY_RUN" = "true" ]; then
            bash scripts/build-images.sh --registry "$REGISTRY" --tags "${TAG},latest" --oci-dir dist/oci
            du -sh dist/oci/*
          else
            bash scripts/build-images.sh --registry "$REGISTRY" --tags "${TAG},latest"
          fi
      - name: trusted-OS variant Astra Linux (amd64, storage server only)
        # optional variants: a full package registry (500 MB quota, HTTP 403) must not block the main images
        continue-on-error: true
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          OCI=""; [ "$DRY_RUN" = "true" ] && OCI="--oci-dir dist/oci"
          # registry.red-soft.ru is signed by the Минцифры "Russian Trusted Sub CA" (2024 key) but serves
          # an older intermediate, so the Go client needs the root and the 2024 sub CA. Both come from the
          # official gosuslugi.ru CDN (gu-st.ru) and are pinned by the SHA-256 of the PEM files.
          # Certificate fingerprints (SHA-256, DER): root D2:6D:2D:02:…:8E:CF:31, sub CA 2024 21:55:78:50:…:7D:88:A3:F2.
          curl -fsSL --retry 3 -o dist/russian_trusted_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          curl -fsSL --retry 3 -o dist/russian_trusted_sub_ca_2024.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_2024_pem.crt
          printf '%s  %s\n' \
            936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504 dist/russian_trusted_root_ca.crt \
            6f9d829c8e6712444fce3624658d8788672849c5d5b7b53fd9cf7e83eac4193e dist/russian_trusted_sub_ca_2024.crt | sha256sum -c -
          # the gosuslugi files have no trailing newline, so join them with awk rather than cat
          awk 1 /etc/ssl/certs/ca-certificates.crt dist/russian_trusted_root_ca.crt dist/russian_trusted_sub_ca_2024.crt > dist/ca-ru.pem
          bash scripts/build-images.sh --registry "$REGISTRY" --tags "$TAG" --platforms linux/amd64 --server-only --skip-console-build \
            --base-image registry.astralinux.ru/library/astra/ubi18:1.8.6 --name-suffix -astra $OCI
      - name: trusted-OS variant RED OS (amd64)
        # optional variants: a full package registry (500 MB quota, HTTP 403) must not block the main images
        continue-on-error: true
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          OCI=""; [ "$DRY_RUN" = "true" ] && OCI="--oci-dir dist/oci"
          SSL_CERT_FILE=dist/ca-ru.pem bash scripts/build-images.sh --registry "$REGISTRY" --tags "$TAG" --platforms linux/amd64 --server-only --skip-console-build \
            --base-image registry.red-soft.ru/ubi8/ubi:8.0.3-261027 --name-suffix -redos $OCI

  packages:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.sha || github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: install helm (from the Go mirror)
        run: |
          GOBIN="$PWD/dist/tools" go install helm.sh/helm/v3/cmd/helm@v3.16.4
      - name: build .deb and .rpm (nfpm via Go mirror)
        run: |
          bash scripts/package-linux.sh
          ls dist/packages/*.deb dist/packages/*.rpm
      - name: lint chart
        run: |
          export PATH="$PWD/dist/tools:$PATH"
          helm lint deploy/helm/datasafes3
      - name: attach packages and checksums to the release
        if: env.DRY_RUN != 'true'
        env:
          GV_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          sh scripts/extract-changelog-section.sh "${TAG#v}" CHANGELOG.md dist/release-body.md
          TAG="$TAG" RELEASE_NOTES_FILE=dist/release-body.md PACKAGE_FALLBACK_TGZ=1 bash scripts/gitverse-release-assets.sh dist/packages/SHA256SUMS.txt dist/packages/*.deb dist/packages/*.rpm
      - name: publish packages to GitVerse registries
        if: env.DRY_RUN != 'true'
        # the package registry has a 500 MB account quota and answers 403 when it is full;
        # the release page above already carries the same files, so a full registry does not stop the release
        continue-on-error: true
        env:
          GV_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          export PATH="$PWD/dist/tools:$PATH"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$TAG" PKG_DIR=dist/packages CHART_SRC=deploy/helm/datasafes3 bash scripts/gitverse-publish-packages.sh

  sbom:
    needs: [images, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dry_run == 'true' && github.sha || github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install SBOM tools and crane (pinned release binaries, sha256-verified; npm mirror)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p dist/tools dist/dl
          fetch() { # url sha256 binary
            f="dist/dl/$(basename "$1")"
            curl -fsSL --retry 3 --max-time 300 -o "$f" "$1"
            echo "$2  $f" | sha256sum -c -
            tar -xzf "$f" -C dist/tools "$3"
          }
          fetch https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v1.12.0/cyclonedx-gomod_1.12.0_linux_amd64.tar.gz \
            004b9f5cc595b797fb5423e2ae4c97bcf0f18c712ed2faee1640b09e5efd6d15 cyclonedx-gomod
          fetch https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz \
            bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d syft
          fetch https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 crane
          dist/tools/cyclonedx-gomod version; dist/tools/syft version | head -3; dist/tools/crane version
          # npm-mirror intermittently answers 504 for uncached packages and npm retries for minutes:
          # mirror capped at 3 minutes, then fall back to the public registry.
          NPM_FAST="--no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1"
          timeout 180 npm install --prefix dist/npm-tools $NPM_FAST --registry "$NPM_REGISTRY" @cyclonedx/cyclonedx-npm@6.0.1 \
            || npm install --prefix dist/npm-tools $NPM_FAST --registry https://registry.npmjs.org/ @cyclonedx/cyclonedx-npm@6.0.1
          dist/npm-tools/node_modules/.bin/cyclonedx-npm --version
      - name: console dependencies for the npm SBOM
        timeout-minutes: 10
        run: cd web/console && npm ci
      - name: SBOM, digests, licence notices
        timeout-minutes: 15
        run: |
          export PATH="$PWD/dist/tools:$PWD/dist/npm-tools/node_modules/.bin:$PATH"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$DRY_RUN" = "true" ]; then
            bash scripts/sbom.sh "${TAG#v}"   # no image SBOMs: nothing was pushed
            ls -l dist/sbom; exit 0
          fi
          export SBOM_SERVER_IMAGE="$REGISTRY/datasafe-storage-server:$TAG"
          export SBOM_CONSOLE_IMAGE="$REGISTRY/datasafe-console:$TAG"
          bash scripts/sbom.sh "${TAG#v}"
          echo "== every image tag referenced by Compose/Helm exists (own images are pushed by now)"
          python3 scripts/check-image-refs.py
          {
            echo "datasafe-storage-server:$TAG $(crane digest "$SBOM_SERVER_IMAGE")"
            echo "datasafe-console:$TAG $(crane digest "$SBOM_CONSOLE_IMAGE")"
          } | tee dist/sbom/image-digests.txt
      - name: attach SBOM and digests to the release
        if: env.DRY_RUN != 'true'
        env:
          GV_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$TAG" bash scripts/gitverse-release-assets.sh \
            "dist/sbom/sbom-${TAG#v}.tgz" dist/sbom/image-digests.txt THIRD_PARTY_LICENSES.md
