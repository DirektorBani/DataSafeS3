name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release pins
        run: bash scripts/check-release-pins.sh
      - name: release workflow
        run: bash scripts/check-release-workflow.sh
      - name: shell scripts are LF
        run: |
          if git ls-files -z '*.sh' | xargs -0 -r grep -l $'\r'; then
            echo "CRLF in shell scripts; .gitattributes requires LF"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt issues:" && gofmt -l . && exit 1)
      - name: govet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datasafe
          POSTGRES_PASSWORD: datasafe
          POSTGRES_DB: datasafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datasafe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Install AWS CLI v2
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install -i /tmp/aws-cli -b /tmp/bin
          echo "/tmp/bin" >> "$GITHUB_PATH"
          /tmp/bin/aws --version
      - name: go test
        env:
          TEST_POSTGRES_DSN: postgres://datasafe:datasafe@localhost:5432/datasafe?sslmode=disable
        run: go test ./...
      - name: kafka bridge protocol
        run: go test -tags datasafe_sinkexec -count=1 -timeout 10m ./internal/events/ -run '^TestKafkaExec'
      - name: Compile API guide Go examples
        run: |
          go build -o /dev/null docs/api-guide/en/examples/go/list_buckets.go
          go build -o /dev/null docs/api-guide/en/examples/go/put_object.go
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: build console
        run: |
          npm ci
          npm run build -w datasafe-console

  event-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus rules and Grafana dashboard
        run: bash scripts/check-event-observability.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (server)
        run: |
          docker build -t datasafe-storage-server:ci -f deploy/docker/Dockerfile \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            .
      - name: Save image for the promote drill
        run: docker save datasafe-storage-server:ci | gzip -1 > datasafe-storage-server-ci.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: storage-server-image
          retention-days: 1
          path: datasafe-storage-server-ci.tar.gz

  # Prod bolt container, resource budget vs the published v1.5.0 image
  # (Bolt and Postgres separately), and install.sh --yes --profiles core.
  single-node-gate:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Gate assertions self-test
        run: python3 scripts/single-node-gate.py self-test
      - name: Log in to GHCR
        # The v1.5.0 package is public. Fork PRs do not receive secrets, and a
        # failed login must not fail the gate.
        if: github.token != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull v1.5.0 baseline
        run: docker pull ghcr.io/direktorbani/datasafe-storage-server:v1.5.0
      - name: Build PR storage-server image
        run: |
          docker build -t datasafe-storage-server:gate -f deploy/docker/Dockerfile \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            .
      - name: Budget and lone-container smoke
        env:
          GATE_SAMPLES_OUT: ${{ runner.temp }}/bolt-samples.json
        run: bash scripts/single-node-gate.sh all
      - name: Postgres resource budget versus v1.5.0
        run: bash scripts/single-node-gate.sh measure-postgres
      - name: v1.5.0 chunked SSE object is readable
        run: bash scripts/single-node-gate.sh legacy-sse
      - name: Build console image for the installer pin
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          docker build -t "ghcr.io/direktorbani/datasafe-console:${tag}" -f deploy/docker/Dockerfile.console .
      - name: Install core profile (non-interactive)
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          docker tag datasafe-storage-server:gate "ghcr.io/direktorbani/datasafe-storage-server:${tag}"
          bash install.sh --yes --profiles core --project datasafe-gate --data-root "${{ runner.temp }}/datasafe-gate"
      - name: Smoke the core install
        run: bash scripts/single-node-gate.sh smoke-installed
      - name: Tear down gate install
        if: always()
        run: |
          docker rm -f -v gate-smoke gate-measure >/dev/null 2>&1 || true
          docker compose -p datasafe-gate -f docker-compose.yml down -v --remove-orphans || true
      - name: Fresh git archive install serves the console
        run: |
          set -euo pipefail
          archive="${{ runner.temp }}/datasafe-archive-src"
          rm -rf "$archive"
          mkdir -p "$archive"
          git archive HEAD | tar -x -C "$archive"
          if [ -f "$archive/web/console/dist/index.html" ]; then
            echo "git archive must not contain web/console/dist/index.html"
            exit 1
          fi
          cd "$archive"
          PUBLIC_HTTP_PORT=18080 bash install.sh --yes --profiles core \
            --project datasafe-archive \
            --data-root "${{ runner.temp }}/datasafe-archive-data"
          body="${{ runner.temp }}/console-index.html"
          code="$(curl -sS -o "$body" -w '%{http_code}' http://127.0.0.1:18080/)"
          echo "GET / -> $code"
          test "$code" = "200"
          grep -q 'id="root"' "$body"
      - name: Tear down archive install
        if: always()
        run: |
          src="${{ runner.temp }}/datasafe-archive-src"
          if [ -f "$src/docker-compose.yml" ]; then
            docker compose -p datasafe-archive -f "$src/docker-compose.yml" down -v --remove-orphans || true
          fi

  # Syntax only. A full Windows Docker install is not part of this job.
  install-ps1-syntax:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errs = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          $text = Get-Content -Raw -LiteralPath .\install.ps1
          if ($text -notmatch '-Yes -Profiles core') {
            throw 'install.ps1 must document non-interactive core: -Yes -Profiles core'
          }
          if ($text -notmatch 'id="root"') {
            throw 'install.ps1 must require the console index.html marker id="root"'
          }
          Write-Host 'install.ps1 parsed; non-interactive core profile is documented'
      - name: Native stderr helper (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:TEMP 'datasafe-native-51.txt'
          if (Test-Path $log) { Remove-Item -Force $log }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\scripts\tests\invoke-native-command.ps1" *> $log
          $code = $LASTEXITCODE
          Write-Host "powershell 5.1 helper exit $code"
          Get-Content -LiteralPath $log
          if ($code -ne 0) { exit $code }
      - name: Native stderr helper (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:TEMP 'datasafe-native-7.txt'
          if (Test-Path $log) { Remove-Item -Force $log }
          & pwsh -NoProfile -File "$PWD\scripts\tests\invoke-native-command.ps1" *> $log
          $code = $LASTEXITCODE
          Write-Host "pwsh helper exit $code"
          Get-Content -LiteralPath $log
          if ($code -ne 0) { exit $code }

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [test, web-console, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build console for compose Caddy
        run: |
          npm ci
          npm run build -w datasafe-console
      - name: Start compose stack for E2E
        env:
          DATASAFE_DATA_ROOT: ${{ github.workspace }}/.datasafe-data-ci
          # Dev stack: login rate limit is 200 (production default is 10) and outbound HTTP stays open for the lab.
          STORAGE_DEV: "true"
          # The encryption-toggle spec enables the card only when this key is set.
          STORAGE_SSE_MASTER_KEY: ci-e2e-sse-master-key
        run: |
          mkdir -p "$DATASAFE_DATA_ROOT/storage" "$DATASAFE_DATA_ROOT/postgres"
          docker compose -p datasafe-ci \
            -f docker-compose.yml \
            -f docker-compose.local-data.yml \
            -f deploy/compose/docker-compose.local-console.yml \
            --profile postgres up -d --build --wait storage-server caddy postgres 2>/dev/null \
            || docker compose -p datasafe-ci \
              -f docker-compose.yml \
              -f docker-compose.local-data.yml \
              -f deploy/compose/docker-compose.local-console.yml \
              --profile postgres up -d --build storage-server caddy postgres
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null \
              && curl -sf http://127.0.0.1:8080/ | grep -q 'id="root"'; then
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time"
          docker compose -p datasafe-ci -f docker-compose.yml -f docker-compose.local-data.yml ps
          exit 1
      - name: Finish first-run setup
        run: bash scripts/ci-complete-setup.sh http://127.0.0.1:8080
      - name: Install Playwright
        working-directory: web/console
        run: npx playwright install chromium --with-deps
      - name: E2E regression
        working-directory: web/console
        run: >
          npx playwright test --workers=1
          e2e/smoke.spec.ts
          e2e/buckets.spec.ts
          e2e/settings.spec.ts
          e2e/files.spec.ts
          e2e/share.spec.ts
          e2e/security-mfa.spec.ts
          e2e/sharing-security.spec.ts
          e2e/share-matrix-messages.spec.ts
          e2e/mfa-stepup.spec.ts
          e2e/encryption-toggle.spec.ts
          e2e/encryption-jobs.spec.ts
          e2e/kms-settings.spec.ts
          e2e/migrate-from-minio.spec.ts
          e2e/teams.spec.ts
          e2e/gateway.spec.ts
      - name: Tear down
        if: always()
        run: |
          docker compose -p datasafe-ci \
            -f docker-compose.yml \
            -f docker-compose.local-data.yml \
            -f deploy/compose/docker-compose.local-console.yml \
            --profile postgres down -v --remove-orphans

  # Real Apache Kafka broker. Skipped by the default go test job (no KAFKA_INTEGRATION).
  kafka-integration:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Wait for the broker
        run: |
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker ps
          exit 1
      - name: Create datasafe.events
        run: |
          cid="$(docker ps -q --filter ancestor=apache/kafka:3.9.2 | head -n 1)"
          test -n "$cid"
          for i in $(seq 1 30); do
            if docker exec "$cid" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list; then
              break
            fi
            sleep 2
          done
          docker exec "$cid" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic datasafe.events --partitions 1 --replication-factor 1
      - name: S3 put, outage, restart
        env:
          KAFKA_INTEGRATION: "1"
          STORAGE_KAFKA_BROKERS: localhost:9092
        run: go test -count=1 -timeout 12m ./internal/api -run TestKafkaBrokerIntegration

  # Dev-mode Vault. The default test job skips TestVaultDevTransit (no VAULT_ADDR).
  # GitHub service containers do not reliably replace the image command, so this
  # job starts `vault server -dev` with docker run.
  vault-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Start Vault dev
        run: |
          docker run -d --name datasafe-vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.18.5 server -dev
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs datasafe-vault || true
          exit 1
      - name: Transit encrypt and decrypt
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: go test -count=1 -timeout 5m ./internal/kms/vaulttransit/ -run TestVaultDevTransit

  # Optional MinIO-compatible source. The default test job skips TestFromMinIOLive.
  minio-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Start MinIO-compatible source
        run: |
          docker run -d --name datasafe-minio \
            -p 19090:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data --console-address ":9001"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:19090/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs datasafe-minio || true
          exit 1
      - name: Copy one object
        env:
          MINIO_ENDPOINT: http://127.0.0.1:19090
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: go test -count=1 -timeout 10m ./internal/migrate/ -run TestFromMinIOLive

  # Console keys: aws s3 ls and mc ls on v1.5.0 and this image must agree.
  list-buckets-clients:
    needs: [docker-build]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storage-server-image
      - name: Load this build
        run: gzip -dc datasafe-storage-server-ci.tar.gz | docker load
      - name: Log in to GHCR
        if: github.token != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull v1.5.0 baseline
        run: docker pull ghcr.io/direktorbani/datasafe-storage-server:v1.5.0
      - name: Install AWS CLI v2 and mc
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install -i /tmp/aws-cli -b /tmp/bin
          curl -fsSL -o /tmp/bin/mc https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          chmod +x /tmp/bin/mc
          echo "/tmp/bin" >> "$GITHUB_PATH"
          /tmp/bin/aws --version
          /tmp/bin/mc --version
      - name: Compare bucket listings
        run: bash scripts/list-buckets-clients.sh

  # 1.5.0 → 1.6.0 on bolt and Postgres, and a 3-node rolling upgrade.
  # Resource budgets stay in single-node-gate; this job does not sample RSS.
  upgrade-16:
    needs: [docker-build]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storage-server-image
      - name: Load this build
        run: gzip -dc datasafe-storage-server-ci.tar.gz | docker load
      - name: Log in to GHCR
        if: github.token != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull v1.5.0 baseline
        run: docker pull ghcr.io/direktorbani/datasafe-storage-server:v1.5.0
      - name: Upgrade bolt and Postgres
        run: bash scripts/ci/upgrade-15-to-16.sh
      - name: Rolling upgrade
        run: bash scripts/ci/rolling-upgrade.sh

  # Postgres primary + replica, two storage-server nodes, webhook traffic
  # across a scripted promote. Ports stay off :9000 and :9001.
  # The image is the docker-build artifact, the same Dockerfile output.
  ha-promote-drill:
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: storage-server-image
      - name: Load release image
        run: gzip -dc datasafe-storage-server-ci.tar.gz | docker load
      - name: Scripted promote drill
        env:
          PROMOTE_DRILL_IMAGE: datasafe-storage-server:ci
          PROMOTE_DRILL_SKIP_BUILD: "1"
        run: bash scripts/ha/run-promote-drill.sh
      - name: Evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence
          if-no-files-found: ignore
          path: |
            /tmp/datasafe-promote-drill/evidence/summary.md
            /tmp/datasafe-promote-drill/evidence/evidence.json
            /tmp/datasafe-promote-drill/evidence.zip
            /tmp/datasafe-promote-drill/storage-a.log
            /tmp/datasafe-promote-drill/storage-b.log
            /tmp/datasafe-promote-drill/postgres-a.log
            /tmp/datasafe-promote-drill/postgres-b.log

  # Postgres, three storage nodes, Vault dev, MinIO, webhook. Ports stay off
  # :9000 and :9001. Resource budgets stay in single-node-gate.
  cluster-kms-gate:
    needs: [docker-build]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - uses: actions/download-artifact@v4
        with:
          name: storage-server-image
      - name: Load this build
        run: gzip -dc datasafe-storage-server-ci.tar.gz | docker load
      - name: Cluster KMS gate
        env:
          KMS_CLUSTER_IMAGE: datasafe-storage-server:ci
          KMS_CLUSTER_SKIP_BUILD: "1"
        run: bash scripts/ha/run-kms-cluster-test.sh
      - name: Evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-kms-evidence
          if-no-files-found: ignore
          path: |
            /tmp/datasafe-kms-cluster/evidence/summary.md
            /tmp/datasafe-kms-cluster/evidence/evidence.json
            /tmp/datasafe-kms-cluster/migrate-first.log
            /tmp/datasafe-kms-cluster/migrate-second.log
            /tmp/datasafe-kms-cluster/vite.log

  openapi-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Embedded copy matches the canonical spec
        run: make openapi-check
      - name: OpenAPI 3.1 schema
        run: bash scripts/ci/openapi-validate.sh
      - name: Desktop contract, route coverage, and error codes
        run: |
          go test ./internal/api/ -count=1 -timeout 15m \
            -run 'TestDesktopOpenAPIConformance|TestOpenAPIRouteCoverage|TestOpenAPI|TestCapabilities|TestDeprecation|TestEnrichAPIError|TestLoginIgnores|TestProductionSpec|TestErrorCode|TestAssignRequest'
          go test ./internal/apicompat/ -count=1

  openapi-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: oasdiff breaking gate
        env:
          API_BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') }}
        run: bash scripts/ci/openapi-breaking.sh

  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty suite until the first Desktop release
        run: bash scripts/ci/desktop-contract.sh
