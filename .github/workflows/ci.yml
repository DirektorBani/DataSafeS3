name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release pins
        run: bash scripts/check-release-pins.sh
      - name: shell scripts are LF
        run: |
          if git ls-files -z '*.sh' | xargs -0 -r grep -l $'\r'; then
            echo "CRLF in shell scripts; .gitattributes requires LF"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt issues:" && gofmt -l . && exit 1)
      - name: govet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datasafe
          POSTGRES_PASSWORD: datasafe
          POSTGRES_DB: datasafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datasafe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: go test
        env:
          TEST_POSTGRES_DSN: postgres://datasafe:datasafe@localhost:5432/datasafe?sslmode=disable
        run: go test ./...
      - name: Compile API guide Go examples
        run: |
          go build -o /dev/null docs/api-guide/en/examples/go/list_buckets.go
          go build -o /dev/null docs/api-guide/en/examples/go/put_object.go
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build console
        working-directory: web/console
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (server)
        run: docker build -f deploy/docker/Dockerfile .

  # Prod bolt container, resource budget vs the published v1.4.1 image, and
  # install.sh --yes --profiles core. PRs into main and pushes to main.
  single-node-gate:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Gate assertions self-test
        run: python3 scripts/single-node-gate.py self-test
      - name: Log in to GHCR
        # The v1.4.1 package is public. Fork PRs do not receive secrets, and a
        # failed login must not fail the gate.
        if: github.token != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull v1.4.1 baseline
        run: docker pull ghcr.io/direktorbani/datasafe-storage-server:v1.4.1
      - name: Build PR storage-server image
        run: docker build -t datasafe-storage-server:gate -f deploy/docker/Dockerfile .
      - name: Budget and lone-container smoke
        run: bash scripts/single-node-gate.sh all
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build console for the core installer
        working-directory: web/console
        run: |
          npm ci
          npm run build
      - name: Install core profile (non-interactive)
        run: |
          docker tag datasafe-storage-server:gate ghcr.io/direktorbani/datasafe-storage-server:v1.4.1
          bash install.sh --yes --profiles core --project datasafe-gate --data-root "${{ runner.temp }}/datasafe-gate"
      - name: Smoke the core install
        run: bash scripts/single-node-gate.sh smoke-installed
      - name: Tear down
        if: always()
        run: |
          docker rm -f -v gate-smoke gate-measure >/dev/null 2>&1 || true
          docker compose -p datasafe-gate -f docker-compose.yml down -v --remove-orphans || true

  # Syntax only. A full Windows Docker install is not part of this job.
  install-ps1-syntax:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errs = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$tokens, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          $text = Get-Content -Raw -LiteralPath .\install.ps1
          if ($text -notmatch '-Yes -Profiles core') {
            throw 'install.ps1 must document non-interactive core: -Yes -Profiles core'
          }
          Write-Host 'install.ps1 parsed; non-interactive core profile is documented'
      - name: Native stderr helper (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:TEMP 'datasafe-native-51.txt'
          if (Test-Path $log) { Remove-Item -Force $log }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$PWD\scripts\tests\invoke-native-command.ps1" *> $log
          $code = $LASTEXITCODE
          Write-Host "powershell 5.1 helper exit $code"
          Get-Content -LiteralPath $log
          if ($code -ne 0) { exit $code }
      - name: Native stderr helper (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:TEMP 'datasafe-native-7.txt'
          if (Test-Path $log) { Remove-Item -Force $log }
          & pwsh -NoProfile -File "$PWD\scripts\tests\invoke-native-command.ps1" *> $log
          $code = $LASTEXITCODE
          Write-Host "pwsh helper exit $code"
          Get-Content -LiteralPath $log
          if ($code -ne 0) { exit $code }

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [test, web-console, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build console for compose Caddy
        working-directory: web/console
        run: |
          npm ci
          npm run build
      - name: Start compose stack for E2E
        env:
          DATASAFE_DATA_ROOT: ${{ github.workspace }}/.datasafe-data-ci
          # Dev stack: login rate limit is 200 (production default is 10) and outbound HTTP stays open for the lab.
          STORAGE_DEV: "true"
        run: |
          mkdir -p "$DATASAFE_DATA_ROOT/storage" "$DATASAFE_DATA_ROOT/postgres"
          docker compose -p datasafe-ci \
            -f docker-compose.yml \
            -f docker-compose.local-data.yml \
            --profile postgres up -d --build --wait storage-server caddy postgres 2>/dev/null \
            || docker compose -p datasafe-ci \
              -f docker-compose.yml \
              -f docker-compose.local-data.yml \
              --profile postgres up -d --build storage-server caddy postgres
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          echo "Stack did not become healthy in time"
          docker compose -p datasafe-ci -f docker-compose.yml -f docker-compose.local-data.yml ps
          exit 1
      - name: Finish first-run setup
        run: bash scripts/ci-complete-setup.sh http://127.0.0.1:8080
      - name: Install Playwright
        working-directory: web/console
        run: npx playwright install chromium --with-deps
      - name: E2E regression
        working-directory: web/console
        run: >
          npx playwright test
          e2e/smoke.spec.ts
          e2e/buckets.spec.ts
          e2e/settings.spec.ts
          e2e/files.spec.ts
          e2e/share.spec.ts
          e2e/security-mfa.spec.ts
          e2e/teams.spec.ts
          e2e/gateway.spec.ts
      - name: Tear down
        if: always()
        run: |
          docker compose -p datasafe-ci \
            -f docker-compose.yml \
            -f docker-compose.local-data.yml \
            --profile postgres down -v --remove-orphans
