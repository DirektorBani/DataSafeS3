# Copy every GitHub branch and tag to https://gitverse.ru/DirektorBani/DataSafeS3.
# Not a platform mirror import: that mode has no GitVerse CI.
# https://gitverse.ru/docs/cicd/faq/
#
# Push is fast-forward only unless force is set. Refs that exist only on
# GitVerse are never deleted. The token is not written into the remote URL.
name: mirror-gitverse

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite branches and tags that diverged on GitVerse. Does not delete refs that exist only there."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror-gitverse-${{ github.repository }}
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository == 'DirektorBani/DataSafeS3' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Mirror script self-test
        run: bash scripts/gitverse-mirror-test.sh

      # format() keeps the string "false". A bare inputs.force is falsy and
      # would fall through to the repository variable.
      - name: Push branches and tags
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_SSH_KEY: ${{ secrets.GITVERSE_SSH_KEY }}
          GITVERSE_MIRROR_AUTH: ${{ vars.GITVERSE_MIRROR_AUTH }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.force) || '' }}
          VAR_FORCE: ${{ vars.GITVERSE_MIRROR_FORCE }}
        run: bash scripts/gitverse-mirror.sh
