name: desktop-ci

# Windows and Linux only. macOS is out of Desktop 1.0.
on:
  push:
    branches:
      - "desktop/**"
  pull_request:

jobs:
  s5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSP and capabilities
        run: bash scripts/ci/desktop-s5.sh

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: WebView system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential
      - name: Install workspaces
        run: npm ci
      - name: Linux deb
        run: npm run tauri -w datasafe-desktop -- build --bundles deb

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspaces
        run: npm ci
      - name: NSIS bundle (MSVC)
        run: npm run tauri -w datasafe-desktop -- build --bundles nsis
      - name: Record installer size
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "clients/desktop/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $bytes = $exe.Length
          Write-Host "NSIS installer: $($exe.FullName) $bytes bytes"
          "$bytes $($exe.Name)" | Set-Content -Encoding ascii -Path nsis-size.txt
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "NSIS installer ``$($exe.Name)``: $bytes bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: datasafe-desktop-nsis
          path: |
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            nsis-size.txt
