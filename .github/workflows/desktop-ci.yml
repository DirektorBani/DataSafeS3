name: desktop-ci

# Windows and Linux only. macOS is out of Desktop 1.0.
on:
  push:
    branches:
      - "desktop/**"
  pull_request:

jobs:
  s5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSP and capabilities
        run: bash scripts/ci/desktop-s5.sh

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: WebView system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Agent unit tests
        run: go test ./cmd/datasafe-agent -count=1
      - name: Desktop library tests
        run: cargo test --lib --manifest-path clients/desktop/src-tauri/Cargo.toml
      - name: Install workspaces
        run: npm ci
      - name: Build agent
        run: |
          mkdir -p clients/desktop/src-tauri/binaries
          sha=$(git rev-parse --short=12 HEAD)
          go build -ldflags "-X main.DesktopCommit=$sha" -o clients/desktop/src-tauri/binaries/datasafe-agent ./cmd/datasafe-agent
      - name: Linux deb
        run: npm run tauri -w datasafe-desktop -- build --bundles deb

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Agent unit tests
        run: go test ./cmd/datasafe-agent -count=1
      - name: Install workspaces
        run: npm ci
      - name: Build agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clients/desktop/src-tauri/binaries | Out-Null
          $sha = (git rev-parse --short=12 HEAD).Trim()
          go build -ldflags "-H windowsgui -X main.DesktopCommit=$sha" -o clients/desktop/src-tauri/binaries/datasafe-agent.exe ./cmd/datasafe-agent
      - name: Test signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=DataSafeS3 Desktop Test" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(1)
          $pass = "datasafe-test-sign"
          $pwd = ConvertTo-SecureString -String $pass -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "datasafe-test-sign.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "DATASAFE_TEST_PFX=$pfx" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_ENV -Value "DATASAFE_TEST_PFX_PASSWORD=$pass" -Encoding utf8NoBOM
          Write-Host "Test signer: $($cert.Subject) $($cert.Thumbprint)"
      - name: Sign agent
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File clients/desktop/src-tauri/windows/sign-test.ps1 (Resolve-Path clients/desktop/src-tauri/binaries/datasafe-agent.exe).Path
      - name: NSIS bundle (MSVC)
        run: npm run tauri -w datasafe-desktop -- build --bundles nsis
      - name: Record installer size and SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "clients/desktop/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $bytes = $exe.Length
          $sha = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          Write-Host "NSIS installer: $($exe.FullName) $bytes bytes"
          Write-Host "NSIS SHA256: $sha"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          if (-not $sig.SignerCertificate) { throw "NSIS installer is not signed" }
          if ($sig.SignerCertificate.Subject -notlike "*DataSafeS3 Desktop Test*") { throw "unexpected signer $($sig.SignerCertificate.Subject)" }
          Write-Host "NSIS signer: $($sig.SignerCertificate.Subject) status $($sig.Status)"
          @(
            "$bytes $($exe.Name)"
            "sha256 $sha $($exe.Name)"
          ) | Set-Content -Encoding ascii -Path nsis-size.txt
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "NSIS installer ``$($exe.Name)``: $bytes bytes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "NSIS SHA256: ``$sha``"
      - name: Imports and silent launch
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ci/desktop-windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: datasafe-desktop-nsis
          path: |
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            nsis-size.txt
