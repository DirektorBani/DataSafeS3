name: desktop-ci

# Windows and Linux only. macOS is out of Desktop 1.0.
# A new push cancels a previous run on the same ref. The Windows smoke
# step used to sit for hours after its own timeouts never fired.
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - "desktop/**"
  pull_request:

jobs:
  s5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSP and capabilities
        run: bash scripts/ci/desktop-s5.sh

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: WebView system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Agent unit tests
        run: go test ./cmd/datasafe-agent -count=1
      - name: Desktop library tests
        run: cargo test --lib --manifest-path clients/desktop/src-tauri/Cargo.toml
      - name: Install workspaces
        run: npm ci
      - name: Accessibility
        run: |
          npx playwright install chromium --with-deps
          npm run e2e -w datasafe-desktop
      - name: Build agent
        run: |
          mkdir -p clients/desktop/src-tauri/binaries
          sha=$(git rev-parse --short=12 HEAD)
          go build -ldflags "-X main.DesktopCommit=$sha" -o clients/desktop/src-tauri/binaries/datasafe-agent ./cmd/datasafe-agent
          rm -f clients/desktop/src-tauri/binaries/.gitkeep
      - name: Linux deb
        run: npm run tauri -w datasafe-desktop -- build --bundles deb
      - name: Pack the Desktop contract suite
        run: bash scripts/ci/desktop-contract.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-contract-1.0.0-dev
          path: desktop-contract-1.0.0-dev.tar.gz

  desktop-compat:
    name: desktop-compat (${{ matrix.profile }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.profile == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/direktorbani/datasafe-storage-server:v1.5.0
            profile: "1.5.0"
          - image: ghcr.io/direktorbani/datasafe-storage-server:v1.6.0
            profile: "1.6.0"
          - image: ghcr.io/direktorbani/datasafe-storage-server:main
            profile: main
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Log in to GHCR
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Contract against ${{ matrix.image }}
        env:
          DATASAFE_COMPAT_IMAGE: ${{ matrix.image }}
          DATASAFE_CONTRACT_PROFILE: ${{ matrix.profile }}
        run: bash scripts/ci/desktop-compat.sh

  # GHCR has no :v1.6.1 tag. release.yml publishes on a git tag, and v1.6.1
  # was not tagged (the GitHub release list stops at v1.6.0). The branch
  # origin/release/1.6.1 is that server. The job links Version=1.6.1.
  desktop-compat-161:
    name: desktop-compat (1.6.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Release branch 1.6.1
        env:
          DATASAFE_COMPAT_MODE: src161
          DATASAFE_CONTRACT_PROFILE: "1.6.1"
        run: bash scripts/ci/desktop-compat.sh

  desktop-compat-dev150:
    name: desktop-compat (v1.5.0 without ldflags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Unstamped v1.5.0 binary
        env:
          DATASAFE_COMPAT_MODE: dev150
          DATASAFE_CONTRACT_PROFILE: "1.5.0"
        run: bash scripts/ci/desktop-compat.sh

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Agent unit tests
        run: go test ./cmd/datasafe-agent -count=1
      - name: Record contract fixtures with Git bash
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ci/desktop-record-windows.ps1
      - name: Install workspaces
        run: npm ci
      - name: Build agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clients/desktop/src-tauri/binaries | Out-Null
          $sha = (git rev-parse --short=12 HEAD).Trim()
          go build -ldflags "-H windowsgui -X main.DesktopCommit=$sha" -o clients/desktop/src-tauri/binaries/datasafe-agent.exe ./cmd/datasafe-agent
          Remove-Item -Force -ErrorAction SilentlyContinue clients/desktop/src-tauri/binaries/.gitkeep
      - name: Test signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=DataSafeS3 Desktop Test" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(1)
          $pass = "datasafe-test-sign"
          $pwd = ConvertTo-SecureString -String $pass -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "datasafe-test-sign.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "DATASAFE_TEST_PFX=$pfx" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_ENV -Value "DATASAFE_TEST_PFX_PASSWORD=$pass" -Encoding utf8NoBOM
          Write-Host "Test signer: $($cert.Subject) $($cert.Thumbprint)"
      - name: Sign agent
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File clients/desktop/src-tauri/windows/sign-test.ps1 (Resolve-Path clients/desktop/src-tauri/binaries/datasafe-agent.exe).Path
      - name: NSIS bundle (MSVC)
        run: npm run tauri -w datasafe-desktop -- build --bundles nsis
      - name: Record installer size and SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "clients/desktop/src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $bytes = $exe.Length
          $sha = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          Write-Host "NSIS installer: $($exe.FullName) $bytes bytes"
          Write-Host "NSIS SHA256: $sha"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          if (-not $sig.SignerCertificate) { throw "NSIS installer is not signed" }
          if ($sig.SignerCertificate.Subject -notlike "*DataSafeS3 Desktop Test*") { throw "unexpected signer $($sig.SignerCertificate.Subject)" }
          Write-Host "NSIS signer: $($sig.SignerCertificate.Subject) status $($sig.Status)"
          @(
            "$bytes $($exe.Name)"
            "sha256 $sha $($exe.Name)"
          ) | Set-Content -Encoding ascii -Path nsis-size.txt
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "NSIS installer ``$($exe.Name)``: $bytes bytes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "NSIS SHA256: ``$sha``"
      - name: Imports and silent launch
        timeout-minutes: 20
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ci/desktop-windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: datasafe-desktop-nsis
          path: |
            clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            nsis-size.txt
