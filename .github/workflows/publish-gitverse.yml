# Publish a v* release to GitVerse package registries (Docker, DEB, RPM, Helm).
# Triggers after a successful Release workflow, or manually via workflow_dispatch.
# If GITVERSE_TOKEN is unset the job succeeds and uploads nothing.
#
# Repository variables used by workflow_run (workflow_dispatch inputs override them):
#   GITVERSE_ARCHITECTURES      all (default) or amd64
#   GITVERSE_DELETE_OLD         true deletes old versions (default false)
#   GITVERSE_KEEP_VERSIONS      default 2; the "latest" tag is kept in addition
#   GITVERSE_SIZE_LIMIT_MB      default 500 (MiB). The account cap is 500 Мбайт.
#   GITVERSE_DEB_DISTRIBUTION   default stable
#   GITVERSE_DEB_COMPONENT      default main
#   GITVERSE_RPM_GROUP          default stable
name: publish-gitverse

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.7.0"
        required: true
        type: string
      architectures:
        description: "all keeps linux/amd64 and linux/arm64; amd64 publishes only amd64"
        type: choice
        options:
          - all
          - amd64
        default: all
      delete_old:
        description: "Delete GitVerse package versions beyond the newest N (keeps the latest tag)"
        type: boolean
        default: false
      keep:
        description: "Newest release versions to keep when delete_old is true"
        type: string
        default: "2"
      size_limit_mb:
        description: "Refuse to upload when the selected artifacts exceed this many MiB"
        type: string
        default: "500"

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-gitverse-${{ github.repository }}
  cancel-in-progress: false

env:
  GITVERSE_USER: DirektorBani
  GITVERSE_DEB_DISTRIBUTION: "${{ vars.GITVERSE_DEB_DISTRIBUTION || 'stable' }}"
  GITVERSE_DEB_COMPONENT: "${{ vars.GITVERSE_DEB_COMPONENT || 'main' }}"
  GITVERSE_RPM_GROUP: "${{ vars.GITVERSE_RPM_GROUP || 'stable' }}"
  CRANE_VERSION: v0.20.6
  HELM_VERSION: v3.16.4

jobs:
  publish:
    if: >-
      github.repository == 'DirektorBani/DataSafeS3' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch || '', 'v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve publish settings
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          INPUT_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.architectures || '' }}
          INPUT_DELETE_OLD: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_old || '' }}
          INPUT_KEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.keep || '' }}
          INPUT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.size_limit_mb || '' }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          VAR_ARCH: ${{ vars.GITVERSE_ARCHITECTURES || '' }}
          VAR_DELETE_OLD: ${{ vars.GITVERSE_DELETE_OLD || '' }}
          VAR_KEEP: ${{ vars.GITVERSE_KEEP_VERSIONS || '' }}
          VAR_LIMIT: ${{ vars.GITVERSE_SIZE_LIMIT_MB || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag=$INPUT_TAG
            arch=$INPUT_ARCH
            delete_old=$INPUT_DELETE_OLD
            keep=$INPUT_KEEP
            limit=$INPUT_LIMIT
          else
            tag=$RUN_HEAD_BRANCH
            arch=$VAR_ARCH
            delete_old=$VAR_DELETE_OLD
            keep=$VAR_KEEP
            limit=$VAR_LIMIT
          fi
          arch=${arch:-all}
          delete_old=$(printf '%s' "${delete_old:-false}" | tr '[:upper:]' '[:lower:]')
          keep=${keep:-2}
          limit=${limit:-500}
          case "$arch" in
            all|amd64) ;;
            *) echo "architectures must be all or amd64, got: $arch" >&2; exit 1 ;;
          esac
          case "$delete_old" in
            true|1|yes) delete_old=true ;;
            false|0|no) delete_old=false ;;
            *) echo "delete_old must be true or false, got: $delete_old" >&2; exit 1 ;;
          esac
          case "$keep" in
            ''|*[!0-9]*) echo "keep must be an integer" >&2; exit 1 ;;
          esac
          case "$limit" in
            ''|*[!0-9]*) echo "size_limit_mb must be an integer" >&2; exit 1 ;;
          esac
          if [ "$keep" -lt 1 ] || [ "$limit" -lt 1 ]; then
            echo "keep and size_limit_mb must be >= 1" >&2
            exit 1
          fi
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z.+-]*$'; then
            echo "tag must look like v1.7.0, got: $tag" >&2
            exit 1
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "${tag#v}"
            printf 'architectures=%s\n' "$arch"
            printf 'delete_old=%s\n' "$delete_old"
            printf 'keep=%s\n' "$keep"
            printf 'limit_mb=%s\n' "$limit"
          } >> "$GITHUB_OUTPUT"

      - name: Skip when GITVERSE_TOKEN is unset
        id: gate
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GITVERSE_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitVerse::GITVERSE_TOKEN is not set. Publish skipped."
            {
              echo "## GitVerse publish skipped"
              echo ""
              echo "Secret \`GITVERSE_TOKEN\` is not set for this repository."
              echo "Add a GitVerse package token (write, and delete if cleanup is enabled) and re-run this workflow."
              echo "Tag: \`${TAG}\`. Nothing was uploaded."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Scripts come from this workflow's commit. The Helm chart comes from the
      # release tag, which may predate the publish scripts (for example v1.7.0).
      - name: Checkout publish scripts
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          path: mirror
          fetch-depth: 1

      - name: Checkout release tag
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.settings.outputs.tag }}
          path: release
          fetch-depth: 1

      - name: Install crane and Helm
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp crane
          install -m 0755 /tmp/crane /usr/local/bin/crane
          crane version
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Download GitHub Release packages
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/packages
          gh release download "$TAG" --dir dist/packages --clobber \
            --pattern 'datasafes3_*.deb' \
            --pattern 'datasafes3-*.rpm'
          find dist/packages -maxdepth 1 -type f -printf '%f %s\n'

      - name: Publish to GitVerse
        if: steps.gate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.settings.outputs.tag }}
          ARCHITECTURES: ${{ steps.settings.outputs.architectures }}
          DELETE_OLD: ${{ steps.settings.outputs.delete_old }}
          KEEP: ${{ steps.settings.outputs.keep }}
          LIMIT_MB: ${{ steps.settings.outputs.limit_mb }}
          PKG_DIR: ${{ github.workspace }}/dist/packages
          CHART_SRC: ${{ github.workspace }}/release/deploy/helm/datasafes3
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash mirror/scripts/gitverse-publish.sh
